<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Career Form Helper</title><link rel="stylesheet" href="popup.css"></head><body>
<h1>Career Form Helper</h1><p>Basic fields, with your review. Nothing is submitted.</p>
<label class="import">Import dashboard profile <input id="profile" type="file" accept="application/json,.json"></label>
<p id="identity">No profile imported.</p><div class="actions"><button id="scan" disabled>Scan this page</button><button id="delete">Delete profile</button></div>
<p id="site"></p><div id="matches"></div><button id="fill" hidden>Fill selected</button><p id="status" role="status"></p>
<p class="note">Only blank, recognized text fields on the main page. Uploads, dropdowns, work history, authorization, declarations and signatures remain manual. Review values in the form after filling.</p>
<script src="popup.js"></script></body></html>
